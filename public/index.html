<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Autenticación</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 Sistema de Autenticación</h1>
            <p>Registro e Inicio de Sesión</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="mostrarTab('registro', event)">Registro</button>
            <button class="tab-button" onclick="mostrarTab('login', event)">Iniciar Sesión</button>
        </div>

        <!-- REGISTRO -->
        <div id="registro-tab" class="tab-content active">
            <h2>Crear Nueva Cuenta</h2>
            <form id="registro-form">
                <div class="form-group">
                    <label for="registro-usuario">Correo electrónico</label>
                    <input type="email" id="registro-usuario" name="usuario"
                        placeholder="tu@correo.com" required autocomplete="email">
                    <small>Se enviará un código de verificación a este correo</small>
                </div>
                <div class="form-group">
                    <label for="registro-contrasena">Contraseña</label>
                    <input type="password" id="registro-contrasena" name="contrasena"
                        placeholder="Ingrese su contraseña" required minlength="6" autocomplete="new-password">
                    <small>Mínimo 6 caracteres</small>
                </div>
                <div class="form-group">
                    <label for="registro-confirmar">Confirmar Contraseña</label>
                    <input type="password" id="registro-confirmar" name="confirmar"
                        placeholder="Confirme su contraseña" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary">Registrarse</button>
            </form>
            <div id="registro-mensaje" class="mensaje"></div>
        </div>

        <!-- LOGIN -->
        <div id="login-tab" class="tab-content">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-usuario">Correo electrónico</label>
                    <input type="email" id="login-usuario" name="usuario"
                        placeholder="tu@correo.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="login-contrasena">Contraseña</label>
                    <input type="password" id="login-contrasena" name="contrasena"
                        placeholder="Ingrese su contraseña" required autocomplete="current-password">
                </div>
                <a class="link-recuperar" onclick="abrirRecuperar()">¿Olvidaste tu contraseña?</a>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>
            
            <div id="login-mensaje" class="mensaje"></div>
        </div>

        <footer>
            <p>Sistema de Autenticación v1.0</p>
        </footer>
    </div>

    <!-- MODAL DE VERIFICACIÓN -->
    <div id="modal-verificacion" style="display:none;">
        <div class="modal-overlay">
            <div class="modal-box">
                <h2>📧 Verifica tu correo</h2>
                <p>Ingresa el código de 6 dígitos enviado a<br><strong id="modal-email"></strong></p>
                <div class="codigo-inputs">
                    <input type="text" class="codigo-digito" maxlength="1" inputmode="numeric" />
                    <input type="text" class="codigo-digito" maxlength="1" inputmode="numeric" />
                    <input type="text" class="codigo-digito" maxlength="1" inputmode="numeric" />
                    <input type="text" class="codigo-digito" maxlength="1" inputmode="numeric" />
                    <input type="text" class="codigo-digito" maxlength="1" inputmode="numeric" />
                    <input type="text" class="codigo-digito" maxlength="1" inputmode="numeric" />
                </div>
                <div id="modal-mensaje" class="mensaje"></div>
                <button id="btn-verificar" class="btn btn-primary" style="margin-top:16px;">Verificar</button>
                <button id="btn-reenviar" class="btn-reenviar">¿No llegó? Reenviar código</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
